[project]
name = "ip2region-ci"
version = "0.1.0"
description = "Manifest-driven CI runner for ip2region bindings and makers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.5",
    "typer>=0.20.0",
]

[project.scripts]
ip2region-ci = "ip2region_ci.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "ruamel-yaml>=0.19.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]
