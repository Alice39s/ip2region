name: C++ Cross-platform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cpp.yml"
      - "binding/cpp/**"
      - "data/**"
      - "scripts/ci-workflow/**"
  push:
    paths:
      - ".github/workflows/cpp.yml"
      - "binding/cpp/**"
      - "data/**"
      - "scripts/ci-workflow/**"

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.system }} ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            architecture: x64
            runner: ubuntu-24.04
          - system: Linux
            architecture: arm64
            runner: ubuntu-24.04-arm
          - system: macOS
            architecture: x64
            runner: macos-15-intel
          - system: macOS
            architecture: arm64
            runner: macos-15
          - system: Windows
            architecture: x64
            runner: windows-2025
          - system: Windows
            architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: scripts/ci-workflow/uv.lock

      - name: Sync control-plane environment
        run: uv sync --project scripts/ci-workflow --all-groups --locked

      - name: Verify native runner architecture
        run: >-
          uv run --project scripts/ci-workflow ip2region-ci architecture
          ${{ matrix.architecture }}

      - name: Build and test C++ binding
        run: uv run --project scripts/ci-workflow ip2region-ci run binding-cpp
