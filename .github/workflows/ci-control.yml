name: CI Control Plane

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci-workflow/**"
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/ci-workflow/**"

permissions:
  contents: read

concurrency:
  group: ci-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifest and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: scripts/ci-workflow/uv.lock

      - name: Sync control-plane environment
        run: uv sync --project scripts/ci-workflow --all-groups --locked

      - name: Check Python formatting
        run: uv run --project scripts/ci-workflow ruff format --check scripts/ci-workflow

      - name: Lint Python
        run: uv run --project scripts/ci-workflow ruff check scripts/ci-workflow

      - name: Test control plane
        run: uv run --project scripts/ci-workflow pytest scripts/ci-workflow

      - name: Validate component coverage
        run: uv run --project scripts/ci-workflow ip2region-ci validate

      - name: Validate GitHub Actions syntax
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: go run github.com/rhysd/actionlint/cmd/actionlint@"${ACTIONLINT_VERSION}"
