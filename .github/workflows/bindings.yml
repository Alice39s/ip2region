name: Language Bindings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bindings.yml"
      - "binding/**"
      - "data/**"
      - "scripts/ci-workflow/**"
  push:
    paths:
      - ".github/workflows/bindings.yml"
      - "binding/**"
      - "data/**"
      - "scripts/ci-workflow/**"

permissions:
  contents: read

concurrency:
  group: bindings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C
            component: binding-c
            runtime: native
            packages: build-essential
          - name: Cangjie
            component: binding-cangjie
            runtime: cangjie
          - name: C#
            component: binding-csharp
            runtime: dotnet
          - name: Erlang
            component: binding-erlang
            runtime: erlang
          - name: Go
            component: binding-golang
            runtime: go
          - name: Java
            component: binding-java
            runtime: java
          - name: JavaScript
            component: binding-javascript
            runtime: node
          - name: Lua
            component: binding-lua
            runtime: native
            packages: lua5.4
          - name: Lua C
            component: binding-lua-c
            runtime: native
            packages: build-essential liblua5.4-dev lua5.4
          - name: Nginx
            component: binding-nginx
            runtime: docker
          - name: PHP
            component: binding-php
            runtime: native
            packages: php-cli
          - name: Python
            component: binding-python
            runtime: python
          - name: Rust
            component: binding-rust
            runtime: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: scripts/ci-workflow/uv.lock

      - name: Sync control-plane environment
        run: uv sync --project scripts/ci-workflow --all-groups --locked

      - name: Install native dependencies
        if: matrix.runtime == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}

      - name: Install Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: binding/golang/go.mod
          cache-dependency-path: binding/golang/go.sum

      - name: Install Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Install Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install .NET
        if: matrix.runtime == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Install Erlang and rebar3
        if: matrix.runtime == 'erlang'
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: 29.0.5
          rebar3-version: 3.27.0

      - name: Update Rust
        if: matrix.runtime == 'rust'
        run: rustup update stable --no-self-update

      - name: Cache Cangjie SDK
        if: matrix.runtime == 'cangjie'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cangjie-sdk
          key: cangjie-linux-x64-1.1.3-2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a

      - name: Install and test Cangjie binding
        if: matrix.runtime == 'cangjie'
        shell: bash
        run: |
          # shellcheck disable=SC1090
          source "$(uv run --project scripts/ci-workflow ip2region-ci install-cangjie "${RUNNER_TEMP}/cangjie-sdk")"
          uv run --project scripts/ci-workflow ip2region-ci run binding-cangjie

      - name: Build and test binding
        if: matrix.runtime != 'cangjie'
        run: >-
          uv run --project scripts/ci-workflow ip2region-ci run
          ${{ matrix.component }}
