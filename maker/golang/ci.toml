toolchain = { name = "go", version = "stable" }
platforms = ["linux", "macos", "windows"]

[[lint]]
name = "Check formatting"
run = ["gofmt", "-l", "."]
fail_on_output = true

[[lint]]
name = "Vet"
run = ["go", "vet", "./..."]

[[test]]
name = "Unit tests"
run = ["go", "test", "./..."]
timeout = 900

[[accept]]
name = "Generate the IPv4 xdb"
run = ["go", "run", ".", "gen", "--src=../../data/ipv4_source.txt", "--dst=ip2region_v4.xdb", "--version=ipv4"]
timeout = 1200

[[accept]]
name = "Compare the IPv4 xdb with the committed one"
run = ["ip2region-ci", "xdb-diff", "../../data/ip2region_v4.xdb", "ip2region_v4.xdb"]

[[accept]]
name = "Generate the IPv6 xdb"
run = ["go", "run", ".", "gen", "--src=../../data/ipv6_source.txt", "--dst=ip2region_v6.xdb", "--version=ipv6"]
timeout = 1200

[[accept]]
name = "Compare the IPv6 xdb with the committed one"
run = ["ip2region-ci", "xdb-diff", "../../data/ip2region_v6.xdb", "ip2region_v6.xdb"]
